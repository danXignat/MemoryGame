<!doctype html>
<html lang="ro">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#0d1418" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Car.dat" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="icon" type="image/png" href="icon-192.png" />
<style>html,body{margin:0;height:100%;background:#0d1418;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}</style>
</head>
<body>
<title>Car.dat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;600;700&display=swap" />
<style>
/* ============================================================================
   style.css  -  how the buttons, cards and menus LOOK.
   Colours are "tokens" at the top; change them there and everything follows.
   ============================================================================ */

:root {
  --font-ui: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-num: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;

  /* page + panels (light) */
  --bg: #dde6de;
  --surface: #ffffff;
  --surface-2: #edf1ee;
  --fg: #14212a;
  --muted: #526670;
  --line: rgba(20, 33, 42, 0.14);
  --accent: #1d6fd1;
  --accent-ink: #ffffff;
  --hi: #ffc928;
  --ok: #148048;
  --ok-soft: #dcf2e5;
  --bad: #c9201f;
  --bad-soft: #fbe1de;

  /* floating game HUD: dark glass in both themes, it sits on top of the road */
  --glass: rgba(11, 19, 23, 0.74);
  --glass-hi: rgba(32, 52, 62, 0.86);
  --glass-fg: #f4f8f6;
  --glass-line: rgba(255, 255, 255, 0.18);
  --gas: #1f9d55;
  --brk: #d33a31;

  --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  --btn: clamp(66px, 19vw, 92px);
  --pw: clamp(72px, 21vw, 98px);
  --bh: calc(var(--pw) * 1.25);
  --gh: calc(var(--pw) * 1.65);
  --topbar-h: 52px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1518;
    --surface: #17232a;
    --surface-2: #22313a;
    --fg: #eaf1ef;
    --muted: #9db1b9;
    --line: rgba(234, 241, 239, 0.16);
    --accent: #5aa2ff;
    --accent-ink: #06121f;
    --ok: #46c57e;
    --ok-soft: #153828;
    --bad: #ff6f62;
    --bad-soft: #43201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1518;
  --surface: #17232a;
  --surface-2: #22313a;
  --fg: #eaf1ef;
  --muted: #9db1b9;
  --line: rgba(234, 241, 239, 0.16);
  --accent: #5aa2ff;
  --accent-ink: #06121f;
  --ok: #46c57e;
  --ok-soft: #153828;
  --bad: #ff6f62;
  --bad-soft: #43201d;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}
[hidden] {
  display: none !important;
}
html,
body {
  height: 100%;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-ui);
  font-size: 15px;
  line-height: 1.4;
  overflow: hidden;
  overscroll-behavior: none;
  touch-action: none; /* no pinch-zoom, no double-tap zoom, no page scrolling */
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
button {
  font: inherit;
  color: inherit;
  border: 0;
  background: none;
  padding: 0;
  cursor: pointer;
  touch-action: manipulation;
}
button:focus-visible {
  outline: 3px solid var(--hi);
  outline-offset: 2px;
}
h1,
h2,
h3,
p {
  margin: 0;
}

#app {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: var(--bg);
}
#game {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  touch-action: none;
}

/* ====================== LANDSCAPE RACING HUD ====================== */
:root {
  --tb: clamp(30px, 4.5vw, 42px);
  --wheel: clamp(104px, 34vh, 156px);
  --mini: clamp(88px, 28vh, 124px);
  --gauge: clamp(104px, 33vh, 150px);
  --pedw: clamp(58px, 9vw, 86px);
  --edge: max(8px, env(safe-area-inset-left, 0px));
  --top: calc(env(safe-area-inset-top, 0px) + 6px);
}
#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 4;
}
#hud > * {
  position: absolute;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: var(--tb);
  padding: 0 10px;
  border-radius: 12px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  color: var(--glass-fg);
  font-size: clamp(10px, 1.6vw, 12.5px);
  white-space: nowrap;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
  pointer-events: auto;
}
.pill b {
  font: 700 clamp(15px, 2.3vw, 19px) / 1 var(--font-num);
}
.pill .k {
  opacity: 0.7;
  letter-spacing: 0.06em;
  font-size: 0.85em;
}
.pill .pen {
  font-weight: 700;
  color: #ffd166;
}
.pill .pen.bad {
  color: #ff7b72;
}

#tl {
  top: var(--top);
  left: var(--edge);
  display: flex;
  gap: 5px;
}
#pillLevel span {
  max-width: 17vw;
  overflow: hidden;
  text-overflow: ellipsis;
}
#pillFuel .fbar {
  width: clamp(26px, 4.4vw, 44px);
  height: 7px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.18);
  overflow: hidden;
}
#pillFuel .fbar i {
  display: block;
  height: 100%;
  width: 60%;
  background: #4ade80;
  border-radius: 4px;
}
#pillFuel.low {
  color: #ff7b72;
  animation: blinkLow 0.9s steps(2) infinite;
}
#pillFuel.low .fbar i {
  background: #ff5d52;
}
@keyframes blinkLow {
  50% {
    opacity: 0.35;
  }
}

#tc {
  top: var(--top);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 4px;
  pointer-events: none;
}
#tc > * {
  pointer-events: auto;
}
.tb {
  position: relative;
  min-width: var(--tb);
  height: var(--tb);
  padding: 0 6px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 4px;
  border-radius: 11px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  color: var(--glass-fg);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
}
.tb svg {
  width: clamp(16px, 2.6vw, 22px);
  height: clamp(16px, 2.6vw, 22px);
  flex: none;
}
.tb.txt span {
  display: none;
  font-size: 11px;
  font-weight: 700;
}
@media (min-width: 820px) {
  .tb.txt span {
    display: inline;
  }
}
.tb.on {
  background: var(--glass-hi);
  border-color: rgba(255, 255, 255, 0.5);
}
.tb.sig.on,
.tb.haz.on {
  color: #ffb000;
  border-color: #ffb000;
}
.tb.sig.on.blink,
.tb.haz.on.blink {
  background: #ffb000;
  color: #241800;
  box-shadow: 0 0 14px 2px rgba(255, 176, 0, 0.8);
}
.tb .lv {
  position: absolute;
  bottom: 1px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  opacity: 0.9;
}
#bLights svg {
  margin-bottom: 5px;
}
#bLights[data-l="1"],
#bLights[data-l="2"] {
  color: #8fe388;
}
#bLights[data-l="3"] {
  color: #6bb8ff;
}
#bEng.off {
  color: #ff7b72;
}
#bEng.starting {
  color: #ffd166;
}
.sep {
  width: 4px;
}
.seg.mini {
  flex: none;
  max-width: none;
  padding: 2px;
  border-radius: 11px;
}
.seg.mini button {
  height: calc(var(--tb) - 6px);
  padding: 0 9px;
  font-size: 11.5px;
  border-radius: 9px;
}

#tr {
  top: var(--top);
  right: max(8px, env(safe-area-inset-right, 0px));
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}
#pillProg b,
#progTxt {
  font: 700 clamp(14px, 2.2vw, 18px) / 1 var(--font-num);
}
.pill.alert {
  max-width: 34vw;
  height: auto;
  min-height: var(--tb);
  padding: 3px 10px 3px 4px;
}
.pill.alert img {
  width: 30px;
  height: 30px;
  flex: none;
}
.pill.alert span {
  white-space: normal;
  font-weight: 700;
  line-height: 1.15;
}

#limit {
  top: calc(var(--top) + var(--tb) + 8px);
  left: var(--edge);
  width: calc(var(--tb) * 1.15);
  height: calc(var(--tb) * 1.15);
  border-radius: 50%;
  background: #fff;
  border: 5px solid #d62828;
  color: #111;
  display: grid;
  place-items: center;
  font: 700 clamp(15px, 2.4vw, 20px) / 1 var(--font-num);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.3);
}
#limit.over {
  animation: blinkLow 0.5s steps(2) infinite;
}

#nav {
  top: calc(var(--top) + var(--tb) + 7px);
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 46vw;
  padding: 6px 14px 6px 10px;
  border-radius: 14px;
  background: rgba(54, 30, 120, 0.88);
  border: 1px solid rgba(190, 160, 255, 0.55);
  color: #fff;
  font-weight: 700;
  font-size: clamp(11px, 1.8vw, 14px);
  line-height: 1.15;
  box-shadow: 0 4px 16px rgba(60, 20, 140, 0.5);
}
#nav svg {
  flex: none;
}
#wrongWay {
  top: calc(var(--top) + var(--tb) + 50px);
  left: 50%;
  transform: translateX(-50%);
  padding: 7px 16px;
  border-radius: 999px;
  background: var(--bad);
  color: #fff;
  font-weight: 700;
  box-shadow: var(--shadow);
  white-space: nowrap;
}

#station {
  left: 50%;
  bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  transform: translateX(-50%);
  padding: 10px 12px;
  border-radius: 16px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  color: var(--glass-fg);
  box-shadow: var(--shadow);
  pointer-events: auto;
  display: grid;
  gap: 8px;
  justify-items: center;
  font-size: 12.5px;
  max-width: 34vw;
  text-align: center;
}
#station .row2 {
  display: flex;
  gap: 8px;
}
#station button {
  height: 40px;
  padding: 0 14px;
  border-radius: 11px;
  background: #12b5a6;
  color: #04201d;
  font-weight: 800;
}
#station button.ghost {
  background: rgba(255, 255, 255, 0.16);
  color: #fff;
}

/* ====================== BOTTOM CONTROLS ====================== */
#bl,
#br {
  position: absolute;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  z-index: 5;
  display: flex;
  align-items: flex-end;
  pointer-events: none;
}
#bl {
  left: var(--edge);
  gap: 10px;
}
#br {
  right: max(8px, env(safe-area-inset-right, 0px));
  gap: 8px;
}
#wheel {
  width: var(--wheel);
  height: var(--wheel);
  pointer-events: auto;
  touch-action: none;
  border-radius: 50%;
  cursor: grab;
  filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
}
#wheel.grab {
  cursor: grabbing;
}
#wheelImg {
  width: 100%;
  height: 100%;
  display: block;
  will-change: transform;
}
#minimap {
  position: relative;
  width: var(--mini);
  height: var(--mini);
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 0 0 2px rgba(143, 91, 255, 0.7), 0 6px 14px rgba(0, 0, 0, 0.5);
  overflow: hidden;
  background: #1d2733;
}
#minimapCv {
  width: 100%;
  height: 100%;
  display: block;
}
#minimap .north {
  position: absolute;
  top: 3px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 9px;
  font-weight: 800;
  color: #fff;
  background: rgba(0, 0, 0, 0.55);
  padding: 0 5px;
  border-radius: 6px;
}
#speedo {
  width: var(--gauge);
  height: var(--gauge);
  pointer-events: none;
  filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.45));
}
#speedoCv {
  width: 100%;
  height: 100%;
  display: block;
}
.pedals {
  display: flex;
  align-items: flex-end;
  gap: 8px;
}
.ctl {
  pointer-events: auto;
  touch-action: none;
  display: grid;
  place-items: center;
  color: var(--glass-fg);
  background: var(--glass);
  border: 2px solid var(--glass-line);
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.38);
  transition: transform 0.06s ease-out, background 0.06s;
  -webkit-tap-highlight-color: transparent;
}
.ctl.down {
  transform: scale(0.93);
  background: var(--glass-hi);
  border-color: rgba(255, 255, 255, 0.5);
}
.pedal {
  width: var(--pedw);
  align-content: end;
  justify-items: center;
  padding-bottom: 10px;
  border-radius: 22px;
  font-weight: 800;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: clamp(10px, 1.5vw, 13px);
  background-image: repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.09) 0 3px, transparent 3px 11px);
  background-color: var(--glass);
}
.pedal small {
  font-size: 9px;
  letter-spacing: 0.06em;
  opacity: 0.7;
  font-weight: 600;
}
.pedal.brake {
  height: calc(var(--pedw) * 1.2);
  border-color: rgba(255, 120, 110, 0.55);
}
.pedal.gas {
  height: calc(var(--pedw) * 1.7);
  border-color: rgba(90, 220, 140, 0.6);
}
.pedal.brake.down {
  background-color: var(--brk);
}
.pedal.gas.down {
  background-color: var(--gas);
}
#btnReset {
  width: 46px;
  height: 46px;
  border-radius: 50%;
  align-content: center;
  font-size: 8px;
  font-weight: 800;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  margin-bottom: calc(var(--pedw) * 1.2 + 10px);
  order: 2;
  position: absolute;
  right: calc(var(--pedw) * 1 + 22px);
  bottom: 0;
  display: none;
}
#br #btnReset {
  display: grid;
  position: static;
  order: 0;
  margin-bottom: 0;
  align-self: flex-end;
}

#rotate {
  position: absolute;
  inset: 0;
  z-index: 60;
  display: grid;
  align-content: center;
  justify-items: center;
  gap: 10px;
  background: rgba(8, 14, 18, 0.94);
  color: #f4f8f6;
  text-align: center;
  padding: 24px;
}
#rotate span {
  opacity: 0.75;
}

/* the whole HUD scales down on small landscape phones */
@media (max-height: 400px) {
  :root {
    --tb: 32px;
  }
  #stage {
    width: min(42vw, 340px);
  }
}
@media (orientation: portrait) {
  :root {
    --wheel: clamp(90px, 26vw, 130px);
    --mini: clamp(70px, 22vw, 100px);
    --gauge: clamp(90px, 26vw, 130px);
    --pedw: clamp(52px, 14vw, 72px);
  }
  #tc {
    top: calc(var(--top) + var(--tb) + 6px);
    flex-wrap: wrap;
    justify-content: center;
    width: 96vw;
  }
  #nav {
    top: calc(var(--top) + var(--tb) * 2 + 20px);
    max-width: 90vw;
  }
  #stage {
    width: 96vw;
    right: 2vw;
    top: calc(var(--top) + var(--tb) * 2 + 66px);
  }
}

/* ------------------------------------------------- sign card + feedback toast */
#stage {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + var(--topbar-h) + 70px);
  left: 50%;
  transform: translateX(-50%);
  width: min(calc(100vw - 20px), 460px);
  pointer-events: none;
}
#card,
#toast {
  pointer-events: auto;
  background: var(--surface);
  color: var(--fg);
  border-radius: 18px;
  box-shadow: var(--shadow);
  overflow: hidden;
  animation: pop 0.18s ease-out;
}
@keyframes pop {
  from {
    transform: translateY(-8px) scale(0.97);
    opacity: 0;
  }
}
.cardrow {
  display: grid;
  grid-template-columns: 64px 1fr;
  gap: 12px;
  padding: 10px 14px 10px 10px;
  align-items: start;
}
.cardrow img {
  width: 64px;
  height: 64px;
  display: block;
}
.pillrow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.pin {
  font-size: 11px;
  color: var(--muted);
  white-space: nowrap;
}
#card.pinned .pin {
  color: var(--accent);
  font-weight: 700;
}
.catpill {
  display: inline-block;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.nameRo {
  font-size: 18px;
  font-weight: 700;
  line-height: 1.15;
  margin-top: 4px;
  text-wrap: balance;
}
.nameEn {
  font-size: 13px;
  color: var(--muted);
  margin-top: 1px;
}
.rule {
  font-size: 13px;
  line-height: 1.36;
  margin-top: 5px;
}
#toast {
  border-left: 8px solid var(--ok);
}
#toast.bad {
  border-left-color: var(--bad);
}
#toast.info {
  border-left-color: var(--accent);
}
.toastrow {
  display: grid;
  grid-template-columns: 56px 1fr;
  gap: 12px;
  padding: 11px 14px 12px 12px;
  align-items: center;
}
.toastrow img {
  width: 56px;
  height: 56px;
}
.verdict {
  display: flex;
  align-items: center;
  gap: 8px;
  font-weight: 800;
  font-size: 16px;
}
.verdict.ok {
  color: var(--ok);
}
.verdict.bad {
  color: var(--bad);
}
.verdict .pts {
  margin-left: auto;
  font: 700 20px/1 var(--font-num);
}
.msg {
  font-size: 14px;
  margin-top: 2px;
  font-weight: 600;
}
.toastrow .rule {
  color: var(--muted);
  font-size: 12.5px;
  margin-top: 4px;
}

/* ------------------------------------------------------------------- overlays */
.overlay {
  position: absolute;
  inset: 0;
  z-index: 20;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(0, 1fr);
  place-items: end center;
  background: rgba(6, 12, 15, 0.6);
  animation: fade 0.16s ease-out;
}
.overlay.center {
  place-items: center;
}
@keyframes fade {
  from {
    opacity: 0;
  }
}
.sheet {
  min-width: 0;
  width: min(100%, 600px);
  max-height: min(92%, 880px);
  align-self: end;
  display: flex;
  flex-direction: column;
  background: var(--surface);
  color: var(--fg);
  border-radius: 22px 22px 0 0;
  box-shadow: var(--shadow);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  animation: rise 0.2s ease-out;
}
.overlay.center .sheet {
  align-self: center;
  border-radius: 22px;
  width: min(calc(100% - 24px), 520px);
  padding-bottom: 0;
}
@keyframes rise {
  from {
    transform: translateY(24px);
    opacity: 0;
  }
}
.sheet-head {
  flex: none;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px 10px 18px;
}
.sheet-head h2 {
  font-size: 19px;
  flex: 1;
  text-wrap: balance;
}
.x {
  width: 44px;
  height: 44px;
  border-radius: 12px;
  background: var(--surface-2);
  display: grid;
  place-items: center;
  font-size: 22px;
  line-height: 1;
}
.sheet-body {
  overflow-y: auto;
  overflow-x: hidden;
  touch-action: pan-y;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  padding: 4px 18px 20px;
  min-height: 0;
}
.chips {
  flex: none;
  display: flex;
  gap: 8px;
  overflow-x: auto;
  touch-action: pan-x;
  padding: 2px 18px 12px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar {
  display: none;
}
.fchip {
  flex: none;
  height: 38px;
  padding: 0 14px;
  border-radius: 999px;
  background: var(--surface-2);
  font-weight: 600;
  font-size: 13.5px;
  border: 2px solid transparent;
  white-space: nowrap;
}
.fchip.on {
  border-color: var(--fg);
  background: var(--surface);
  font-weight: 800;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(148px, 1fr));
  gap: 10px;
}
.tile {
  display: grid;
  justify-items: center;
  gap: 6px;
  padding: 12px 8px 12px;
  border-radius: 16px;
  background: var(--surface-2);
  text-align: center;
  min-width: 0;
  border-top: 5px solid var(--cat, var(--line));
}
.tile img {
  width: 84px;
  height: 84px;
}
.tile b {
  font-size: 13.5px;
  line-height: 1.2;
  text-wrap: balance;
}
.tile small {
  font-size: 11.5px;
  color: var(--muted);
}
.empty {
  padding: 24px 0;
  color: var(--muted);
  text-align: center;
}
.detail {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 4px;
  padding-top: 6px;
}
.detail img {
  width: min(52vw, 200px);
  height: min(52vw, 200px);
}
.detail .nameRo {
  font-size: 23px;
}
.detail .rule {
  text-align: left;
  font-size: 15.5px;
  margin-top: 10px;
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  width: 100%;
}
.detail .rule + .rule {
  margin-top: 8px;
  font-size: 14px;
  color: var(--muted);
}
.btn {
  min-height: 52px;
  padding: 0 20px;
  border-radius: 15px;
  font-weight: 800;
  font-size: 16px;
  background: var(--accent);
  color: var(--accent-ink);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
.btn.ghost {
  background: var(--surface-2);
  color: var(--fg);
}
.btn.block {
  width: 100%;
}
.btn.big {
  min-height: 72px;
  font-size: 19px;
  flex-direction: column;
  gap: 2px;
}
.btn.big small {
  font-size: 13px;
  font-weight: 500;
  opacity: 0.85;
}
.btn.warn {
  background: var(--bad);
  color: #fff;
}
.stack {
  display: grid;
  gap: 10px;
}

/* welcome */
.welcome {
  text-align: center;
  padding: 22px 20px 22px;
  display: grid;
  gap: 14px;
}
.welcome .signrow {
  display: flex;
  justify-content: center;
  gap: 10px;
}
.welcome .signrow img {
  width: 52px;
  height: 52px;
}
.welcome h1 {
  font: 700 34px/1 var(--font-num);
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.welcome p {
  color: var(--muted);
  font-size: 14.5px;
}

/* quiz */
.quiz {
  display: grid;
  gap: 12px;
  padding: 18px 18px 18px;
  justify-items: center;
}
.quiz img {
  width: 130px;
  height: 130px;
}
.quiz h2 {
  font-size: 18px;
  text-align: center;
}
.opt {
  width: 100%;
  text-align: left;
  min-height: 58px;
  padding: 9px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 2px solid transparent;
  display: grid;
  align-content: center;
}
.opt b {
  font-size: 15.5px;
  line-height: 1.2;
}
.opt small {
  font-size: 12.5px;
  color: var(--muted);
}
.opt.right {
  background: var(--ok-soft);
  border-color: var(--ok);
}
.opt.wrong {
  background: var(--bad-soft);
  border-color: var(--bad);
}
.explain {
  width: 100%;
  padding: 11px 14px;
  border-radius: 14px;
  background: var(--surface-2);
  font-size: 14px;
}
.explain .verdict {
  margin-bottom: 4px;
}

/* results */
.score {
  display: grid;
  justify-items: center;
  padding: 4px 0 6px;
}
.score .big {
  font: 700 64px/1 var(--font-num);
}
.score .big span {
  font-size: 30px;
  color: var(--muted);
}
.score .pct {
  font-weight: 700;
  color: var(--muted);
}
.catrow {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 10px;
  padding: 8px 0;
}
.catrow .label {
  font-weight: 700;
  font-size: 14px;
}
.catrow .val {
  font: 700 18px/1 var(--font-num);
}
.bar {
  grid-column: 1 / -1;
  height: 10px;
  border-radius: 6px;
  background: var(--surface-2);
  overflow: hidden;
}
.bar i {
  display: block;
  height: 100%;
  background: var(--cat, var(--accent));
  border-radius: 6px;
}
.sectionTitle {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 16px 0 6px;
}
.miss {
  display: grid;
  grid-template-columns: 52px 1fr;
  gap: 12px;
  padding: 10px 0;
  border-top: 1px solid var(--line);
  align-items: center;
}
.miss img {
  width: 52px;
  height: 52px;
}
.miss b {
  font-size: 14.5px;
}
.miss p {
  font-size: 13px;
  color: var(--muted);
  margin-top: 2px;
}

/* menu */
.row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
}
.row > label,
.row > span {
  font-weight: 600;
}
.row small {
  display: block;
  color: var(--muted);
  font-weight: 400;
  font-size: 12.5px;
}
.seg2 {
  display: inline-grid;
  grid-auto-flow: column;
  gap: 3px;
  padding: 3px;
  background: var(--surface-2);
  border-radius: 12px;
}
.seg2 button {
  min-width: 64px;
  height: 38px;
  padding: 0 12px;
  border-radius: 9px;
  font-weight: 700;
  font-size: 13.5px;
}
.seg2 button.on {
  background: var(--accent);
  color: var(--accent-ink);
}
.howto {
  padding: 4px 0 0 18px;
  display: grid;
  gap: 8px;
  font-size: 14.5px;
}
.fatal {
  position: absolute;
  inset: 12px;
  z-index: 100;
  padding: 16px;
  border-radius: 16px;
  background: #fff;
  color: #7a0b0b;
  font: 13px/1.4 monospace;
  overflow: auto;
  user-select: text;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ---- card / toast sizes for the landscape HUD (kept last so they win) ---- */
#stage {
  position: absolute;
  top: calc(var(--top) + var(--tb) + 52px);
  right: max(8px, env(safe-area-inset-right, 0px));
  left: auto;
  transform: none;
  width: min(40vw, 380px);
  pointer-events: none;
}
.cardrow {
  grid-template-columns: 52px 1fr;
  padding: 8px 12px 8px 8px;
}
.cardrow img {
  width: 52px;
  height: 52px;
}
.nameRo {
  font-size: clamp(14px, 2.1vw, 16.5px);
}
.rule {
  font-size: clamp(11px, 1.7vw, 12.5px);
}
.toastrow {
  grid-template-columns: 44px 1fr;
  padding: 8px 12px 8px 8px;
}
.toastrow.noimg {
  grid-template-columns: 1fr;
}
.toastrow img {
  width: 44px;
  height: 44px;
}
.verdict {
  font-size: clamp(13px, 2vw, 15px);
}
.msg {
  font-size: clamp(11.5px, 1.8vw, 13px);
}
.toastrow .rule {
  font-size: clamp(10.5px, 1.6vw, 12px);
}


/* ====================== new screens: pickers, results, ending ====================== */
.sheet.wide {
  width: min(96%, 860px);
}
.overlay.center .sheet.wide {
  width: min(96%, 860px);
}
.overlay .sheet {
  max-height: min(94%, 880px);
}
.cols {
  display: grid;
  grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
  gap: 18px;
}
@media (max-width: 560px) {
  .cols {
    grid-template-columns: 1fr;
  }
}
.stats {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin: 10px 0 12px;
}
.stats div {
  background: var(--surface-2);
  border-radius: 12px;
  padding: 8px 10px;
  display: grid;
}
.stats b {
  font: 700 22px/1.1 var(--font-num);
}
.stats span {
  font-size: 11px;
  color: var(--muted);
}
.okc {
  color: var(--ok);
}
.badc {
  color: var(--bad);
}
.score .big {
  font: 700 44px/1 var(--font-num);
  letter-spacing: 0.04em;
}
.pn {
  font-size: 11px;
  font-weight: 800;
  color: var(--bad);
  margin-left: 4px;
}
.miss.noimg {
  grid-template-columns: 1fr;
}
.stack.two {
  grid-template-columns: 1fr 1fr;
}
.detail.row {
  grid-auto-flow: column;
  grid-template-columns: auto 1fr;
  justify-items: start;
  text-align: left;
  gap: 16px;
}
.detail.row img {
  width: min(28vw, 170px);
  height: min(28vw, 170px);
}
.detail.row .rule {
  margin-top: 8px;
}
.quizsheet {
  width: min(96%, 640px);
}
.quiz {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 16px;
  align-items: center;
  justify-items: stretch;
}
.quiz img {
  width: min(26vw, 150px);
  height: min(26vw, 150px);
  justify-self: center;
}
.qcol {
  display: grid;
  gap: 8px;
}
.qcol h2 {
  text-align: left;
  font-size: 16px;
}
.opt {
  min-height: 48px;
}
.cargrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 10px;
}
.carcard {
  text-align: left;
  padding: 12px;
  border-radius: 16px;
  background: var(--surface-2);
  border: 2px solid transparent;
  display: grid;
  gap: 5px;
  align-content: start;
}
.carcard.sel {
  border-color: var(--accent);
  background: var(--surface);
  box-shadow: 0 0 0 2px var(--accent) inset;
}
.chead {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  align-items: center;
}
.chead b {
  font-size: 15.5px;
}
.diff {
  font-size: 10.5px;
  font-weight: 800;
  padding: 2px 8px;
  border-radius: 999px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: #fff;
}
.diff.easy {
  background: #148048;
}
.diff.medium {
  background: #c28400;
}
.diff.challenging {
  background: #c9201f;
}
.csub {
  font-size: 12px;
  color: var(--muted);
}
.cblurb {
  font-size: 12.5px;
  line-height: 1.35;
}
.cstats {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 3px 8px;
  align-items: center;
  font-size: 11.5px;
  color: var(--muted);
  margin-top: 4px;
}
.sb {
  display: inline-flex;
  gap: 3px;
}
.sb i {
  width: 100%;
  max-width: 18px;
  height: 7px;
  border-radius: 3px;
  background: var(--line);
}
.sb i.on {
  background: var(--accent);
}
.lvgrid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 8px;
}
.lvtile {
  text-align: left;
  display: grid;
  gap: 2px;
  align-content: start;
  padding: 10px 11px;
  border-radius: 14px;
  background: var(--surface-2);
  border: 2px solid transparent;
  min-width: 0;
}
.lvtile.sel {
  border-color: var(--accent);
}
.lvtile.soon {
  opacity: 0.72;
}
.lvtile b {
  font-size: 13.5px;
  line-height: 1.2;
}
.lvtag {
  font: 700 18px/1 var(--font-num);
  color: var(--accent);
}
.lvd,
.lvm {
  font-size: 11px;
  color: var(--muted);
}
.lvm {
  font-weight: 700;
}
.ending .endcols {
  align-items: center;
}
.licence {
  border-radius: 16px;
  padding: 12px;
  color: #10261c;
  background: linear-gradient(135deg, #dff3e7, #bfe0cf 60%, #a9d1be);
  box-shadow: var(--shadow);
  transform: rotate(-2deg);
}
.lhead {
  display: grid;
  font-size: 10px;
  letter-spacing: 0.12em;
}
.lhead b {
  font-size: 14px;
  letter-spacing: 0.06em;
}
.lbody {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 12px;
  margin-top: 10px;
  align-items: center;
}
.lphoto {
  width: 64px;
  height: 78px;
  border-radius: 8px;
  background: rgba(16, 38, 28, 0.15);
  display: grid;
  place-items: center;
  font: 700 34px/1 var(--font-num);
}
.lk {
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  opacity: 0.7;
  margin-top: 4px;
}
.endtitle {
  font: 700 32px/1.05 var(--font-num);
  text-transform: uppercase;
  letter-spacing: 0.02em;
}
.endmsg {
  margin-top: 6px;
  font-size: 14px;
}
.endmsg.en {
  color: var(--muted);
  font-size: 12.5px;
}
.route {
  font-size: 12px;
  color: var(--muted);
  margin-bottom: 10px;
}

/* ---- top-left stack, mode switch, card layout (kept last so they win) ---- */
#tl {
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}
#tl .trow {
  display: flex;
  gap: 5px;
}
#pillLevel b {
  letter-spacing: 0.02em;
}
#pillZone {
  height: 26px;
  font-weight: 600;
  max-width: 30vw;
}
#pillZone span {
  overflow: hidden;
  text-overflow: ellipsis;
}
#limit {
  top: calc(var(--top) + (var(--tb) + 4px) + 30px + 56px);
}
.seg {
  display: grid;
  grid-template-columns: 1fr 1fr;
  padding: 3px;
  border-radius: 14px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.28);
}
.seg button {
  height: 36px;
  border-radius: 11px;
  font-weight: 700;
  letter-spacing: 0.02em;
  color: var(--glass-fg);
  opacity: 0.8;
}
.seg button.on {
  background: var(--hi);
  color: #231a00;
  opacity: 1;
}
.seg.mini {
  padding: 2px;
  border-radius: 11px;
}
.seg.mini button {
  height: calc(var(--tb) - 6px);
  padding: 0 9px;
  font-size: 11.5px;
  border-radius: 9px;
}
#stage,
.mode-test #stage {
  top: calc(var(--top) + var(--tb) + 56px);
}
#card .rule {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
#card.pinned .rule {
  -webkit-line-clamp: unset;
}
#card .catpill {
  font-size: 10px;
  letter-spacing: 0.02em;
  padding: 2px 8px;
}
@media (orientation: portrait) {
  #stage,
  .mode-test #stage {
    top: calc(var(--top) + var(--tb) * 2 + 66px);
  }
}

/* ====================== portraits, indications, search ====================== */
.pf {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  object-fit: cover;
  background: #223;
  flex: none;
  border: 2px solid rgba(255, 255, 255, 0.85);
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.35);
}
.pf.sm {
  width: 30px;
  height: 30px;
}
.avatar {
  width: var(--tb);
  height: var(--tb);
  pointer-events: auto;
}
#pax {
  height: 34px;
  padding: 0 10px 0 3px;
  gap: 7px;
  border-color: rgba(47, 191, 113, 0.8);
}
#pax .pf {
  width: 26px;
  height: 26px;
  border-width: 2px;
  border-color: #2fbf71;
}
#pax.wince {
  border-color: #ff9f1c;
}
#pax.wince .pf {
  border-color: #ff9f1c;
}
#paxTxt {
  font-weight: 700;
  color: #ffd166;
}

.pill.alert {
  max-width: min(36vw, 330px);
  gap: 8px;
  align-items: center;
  padding: 4px 10px 4px 5px;
  text-align: left;
}
.pill.alert .at {
  display: grid;
  gap: 1px;
  min-width: 0;
}
.pill.alert .at b {
  font: 700 11.5px/1.2 var(--font-ui);
  white-space: normal;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.pill.alert .at small {
  font-size: 10.5px;
  opacity: 0.8;
  font-weight: 700;
  letter-spacing: 0.03em;
}
.dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  flex: none;
  background: #8aa0ad;
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.25);
}
.dot.ok {
  background: #3ddc84;
  box-shadow: 0 0 8px #3ddc84;
}
.dot.violated {
  background: #ff5d52;
  box-shadow: 0 0 8px #ff5d52;
}
.dot.watch {
  background: #ffc928;
}
.mode-test #stage {
  top: calc(var(--top) + var(--tb) + 72px);
}
.donow {
  margin-top: 5px;
  font-size: clamp(11.5px, 1.8vw, 13px);
  line-height: 1.3;
  padding: 5px 8px;
  border-radius: 9px;
  background: var(--surface-2);
}
.donow b {
  color: var(--accent);
  margin-right: 3px;
  text-transform: uppercase;
  font-size: 10.5px;
  letter-spacing: 0.05em;
}
#card:not(.pinned) .rule {
  display: none;
}
#card.pinned .rule {
  display: block;
}
.pin b {
  color: var(--fg);
  margin-right: 4px;
}

.searchbar {
  flex: none;
  padding: 0 18px 8px;
  user-select: text;
}
.searchbar input {
  width: 100%;
  height: 42px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface-2);
  color: var(--fg);
  font: inherit;
  padding: 0 14px;
  user-select: text;
  -webkit-user-select: text;
}
.isecs {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 8px;
  margin-top: 10px;
}
.isec {
  padding: 10px 12px;
  border-radius: 12px;
  background: var(--surface-2);
}
.isec h4 {
  margin: 0 0 3px;
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent);
}
.isec p {
  font-size: 13px;
  line-height: 1.35;
}
.isec.trap {
  background: var(--bad-soft);
}
.isec.trap h4 {
  color: var(--bad);
}

.credit {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  justify-self: center;
  font-size: 12.5px;
  color: var(--muted);
  font-weight: 600;
}
.duo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 6px 0 4px;
  font-weight: 700;
}
.duo .pf {
  width: 54px;
  height: 54px;
  border-color: var(--surface);
}
.duo i {
  font-style: normal;
  color: var(--muted);
}
.lphoto {
  overflow: hidden;
}
.lphoto .pf {
  width: 100%;
  height: 100%;
  border-radius: 8px;
  border: 0;
  box-shadow: none;
}
.toastrow .pf {
  width: 44px;
  height: 44px;
}

/* ---- tighter top bar with the avatar (kept last) ---- */
:root {
  --tb: clamp(28px, 4.1vw, 40px);
}
#pillScore .k {
  display: none;
}
@media (min-width: 1000px) {
  .tb.txt span {
    display: inline;
  }
}
@media (min-width: 820px) and (max-width: 999px) {
  .tb.txt span {
    display: none;
  }
}
#card .donow {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
#card.pinned .donow {
  -webkit-line-clamp: unset;
}
#limit {
  top: calc(var(--top) + (var(--tb) + 4px) + 30px + 56px + 38px);
}
.pill.alert {
  max-width: min(30vw, 300px);
}
#nav {
  max-width: 36vw;
}

/* ---- Car.dat logo on the welcome screen ---- */
.logobox {
  background: #000;
  border-radius: 16px;
  padding: 6px;
  display: grid;
  place-items: center;
  justify-self: center;
}
.logo {
  display: block;
  width: min(34vh, 220px);
  height: auto;
  border-radius: 12px;
}
.welcome {
  gap: 10px;
}
.welcome .signrow {
  display: none;
}

/* ====================== INDICATION DOCK (bottom centre) ======================
   Sits between the wheel cluster and the speedometer/pedals, so it never
   covers the road ahead or the controls. Card, feedback and tips share it. */
:root {
  --dock-l: calc(var(--edge) + var(--wheel) + var(--mini) + 20px);
  --dock-r: calc(max(8px, env(safe-area-inset-right, 0px)) + 46px + var(--gauge) + var(--pedw) * 2 + 38px);
}
#stage,
.mode-test #stage {
  top: auto;
  bottom: calc(8px + env(safe-area-inset-bottom, 0px));
  left: var(--dock-l);
  right: var(--dock-r);
  width: auto;
  max-width: 400px;
  margin: 0 auto;
  transform: none;
  z-index: 6;
}
#card,
#toast {
  border-radius: 14px;
}
#card {
  border-left: 6px solid var(--cat, var(--accent));
}
.cardrow {
  grid-template-columns: 40px 1fr;
  gap: 8px;
  padding: 7px 9px 7px 7px;
}
.cardrow img {
  width: 40px;
  height: 40px;
}
.chd {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 6px;
}
.chd .nameRo {
  margin-top: 0;
  font-size: clamp(12px, 1.8vw, 14.5px);
  line-height: 1.12;
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  overflow: hidden;
}
.cmeta {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  flex: none;
  font-size: 11px;
  white-space: nowrap;
}
.cmeta .dot.hide {
  display: none;
}
.cmeta .dot {
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
}
#card .nameEn {
  font-size: 10.5px;
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#card .donow {
  margin-top: 4px;
  padding: 4px 7px;
  font-size: clamp(10.5px, 1.6vw, 12px);
  -webkit-line-clamp: 3;
}
.toastrow {
  grid-template-columns: 36px 1fr;
  gap: 8px;
  padding: 7px 9px 7px 7px;
}
.toastrow.noimg {
  grid-template-columns: 1fr;
}
.toastrow img,
.toastrow .pf {
  width: 36px;
  height: 36px;
}
.verdict {
  font-size: clamp(12px, 1.8vw, 14px);
  gap: 6px;
}
.verdict .pts {
  font-size: 15px;
}
.msg {
  font-size: clamp(10.5px, 1.6vw, 12px);
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}
.toastrow .rule {
  display: none;
}
#alertPill {
  display: none !important;
}

/* narrow phones: the minimap moves to the top right so the dock keeps its space */
@media (max-width: 780px) {
  :root {
    --dock-l: calc(var(--edge) + var(--wheel) + 14px);
  }
  #minimap {
    position: fixed;
    top: calc(var(--top) + var(--tb) + 8px);
    right: max(8px, env(safe-area-inset-right, 0px));
    width: 78px;
    height: 78px;
  }
  #nav {
    max-width: 40vw;
  }
}
@media (orientation: portrait) {
  #stage,
  .mode-test #stage {
    left: 2vw;
    right: 2vw;
    bottom: calc(var(--wheel) + 24px);
    max-width: none;
  }
}
.cardrow,
.toastrow {
  grid-template-columns: 40px minmax(0, 1fr);
}
.toastrow.noimg {
  grid-template-columns: minmax(0, 1fr);
}
.toastrow {
  grid-template-columns: 36px minmax(0, 1fr);
}
.ctext,
.toastrow > div {
  min-width: 0;
}

/* speed-limit badge floats just above the dock instead of the left column */
#limit {
  top: auto;
  left: var(--dock-l);
  bottom: calc(8px + env(safe-area-inset-bottom, 0px) + 84px);
  width: 40px;
  height: 40px;
  border-width: 4px;
  font-size: 15px;
}
@media (max-width: 780px) {
  /* avatar on its own line so the score never runs under the signal buttons */
  #tl .trow {
    flex-direction: column;
    align-items: flex-start;
    gap: 4px;
  }
  .avatar {
    width: 34px;
    height: 34px;
  }
  #pillZone {
    max-width: 24vw;
  }
}
#limit {
  bottom: calc(8px + env(safe-area-inset-bottom, 0px) + 118px);
  z-index: 7;
}

/* ---- steering choice: arrow buttons (default) or the wheel ---- */
:root {
  --arw: clamp(56px, 17vh, 78px);
}
#arrows {
  display: none;
  gap: 8px;
  align-items: flex-end;
  pointer-events: none;
}
.arw {
  width: var(--arw);
  height: var(--arw);
  border-radius: 22px;
}
.steer-arrows {
  --wheel: calc(var(--arw) * 2 + 8px); /* keeps the dock maths right */
}
.steer-arrows #wheel {
  display: none;
}
.steer-arrows #arrows {
  display: flex;
}
.steer-arrows {
  --dock-l: calc(var(--edge) + var(--wheel) + var(--mini) + 20px);
}
@media (max-width: 780px) {
  .steer-arrows {
    --dock-l: calc(var(--edge) + var(--wheel) + 14px);
  }
}

/* fuel-station panel sits under the navigation banner, clear of the bottom dock */
#station {
  top: calc(var(--top) + var(--tb) + 58px);
  bottom: auto;
  z-index: 8;
  max-width: 46vw;
}
#card .donow {
  display: block;
  -webkit-line-clamp: unset;
}
#card .donow .dt {
  display: -webkit-box;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 3;
  overflow: hidden;
}

/* ====================== AIRY HUD (kept last) ======================
   Fewer, lighter elements: driving buttons in one slim capsule, everything
   else behind the menu button. */
:root {
  --tb: clamp(28px, 3.8vw, 36px);
  --glass: rgba(14, 20, 26, 0.5);
  --glass-line: rgba(255, 255, 255, 0.12);
}
#tc {
  gap: 2px;
  padding: 3px;
  border-radius: 14px;
  background: var(--glass);
  border: 1px solid var(--glass-line);
  -webkit-backdrop-filter: blur(6px);
  backdrop-filter: blur(6px);
  pointer-events: auto;
}
#tc .tb {
  background: transparent;
  border-color: transparent;
  box-shadow: none;
  min-width: calc(var(--tb) + 4px);
}
#tc .tb.on {
  background: rgba(255, 255, 255, 0.14);
}
#tc .tb.sig.on.blink,
#tc .tb.haz.on.blink {
  background: #ffb000;
}
.pill,
.tb {
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
}
#tl {
  gap: 6px;
}
#tl .pill {
  height: calc(var(--tb) - 4px);
  padding: 0 9px;
  border-radius: 10px;
}
#pillZone .prog {
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
  margin-left: 4px;
  padding-left: 7px;
  border-left: 1px solid rgba(255, 255, 255, 0.2);
}
#pillZone .prog b {
  font: 700 clamp(13px, 2vw, 16px) / 1 var(--font-num);
}
#tr {
  gap: 6px;
}
#bMenu {
  min-width: var(--tb);
}
#nav {
  max-width: 34vw;
  padding: 5px 12px 5px 8px;
  gap: 6px;
  border-radius: 12px;
  font-size: clamp(11px, 1.6vw, 13px);
  background: rgba(54, 30, 120, 0.78);
  box-shadow: 0 3px 10px rgba(60, 20, 140, 0.35);
}
#nav svg {
  width: 20px;
  height: 20px;
}
@media (max-width: 780px) {
  .avatar {
    width: 30px;
    height: 30px;
  }
  #minimap {
    width: 72px;
    height: 72px;
  }
}

/* menu tiles: car, level, signs, restart */
.mtiles {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.mtile {
  display: grid;
  justify-items: center;
  gap: 4px;
  padding: 10px 4px;
  border-radius: 14px;
  background: var(--surface-2, rgba(127, 127, 127, 0.12));
  border: 1px solid var(--line, rgba(127, 127, 127, 0.25));
  color: inherit;
  font-weight: 700;
  font-size: 12.5px;
}
.mtile:active {
  transform: scale(0.97);
}
#tr > * {
  pointer-events: auto;
}
#pillZone {
  max-width: 36vw;
}
#pillZone #progK {
  display: none;
}
#pillZone .prog b::before {
  content: '✓ ';
  font-size: 0.8em;
  opacity: 0.7;
}

/* speed camera photo flash */
#app.camflash::after {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 30;
  pointer-events: none;
  background: #fff;
  animation: camflash 0.45s ease-out forwards;
}
@keyframes camflash {
  from {
    opacity: 0.75;
  }
  to {
    opacity: 0;
  }
}

/* ====================== PORTRAIT (phone held upright) ======================
   Row 1: avatar · driving capsule · menu.  Left column: score, fuel, level.
   Right: minimap, speed limit.  Bottom: arrows left, speedometer over pedals right. */
@media (orientation: portrait) {
  :root {
    --arw: clamp(56px, 17vw, 72px);
    --pedw: clamp(52px, 14vw, 64px);
    --gauge: clamp(90px, 25vw, 112px);
  }
  #tc {
    top: var(--top);
    width: auto;
    flex-wrap: nowrap;
  }
  #tc .tb {
    min-width: calc(var(--tb) + 2px);
  }
  #tl .trow {
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
  }
  .avatar {
    width: 32px;
    height: 32px;
  }
  #pillZone {
    max-width: 62vw;
  }
  #minimap {
    position: fixed;
    top: calc(var(--top) + var(--tb) + 8px);
    right: max(8px, env(safe-area-inset-right, 0px));
    width: 84px;
    height: 84px;
  }
  #limit {
    top: calc(var(--top) + var(--tb) + 100px);
    bottom: auto;
    left: auto;
    right: calc(max(8px, env(safe-area-inset-right, 0px)) + 22px);
  }
  #nav {
    top: calc(var(--top) + var(--tb) + 150px);
    max-width: 92vw;
  }
  #station {
    top: calc(var(--top) + var(--tb) + 210px);
    max-width: 92vw;
  }
  #br {
    flex-direction: column;
    align-items: flex-end;
    gap: 6px;
  }
  #br #btnReset {
    align-self: flex-start;
  }
  #stage,
  .mode-test #stage {
    top: auto;
    left: 2vw;
    right: calc(var(--pedw) * 2 + 26px);
    bottom: calc(var(--arw) + 22px);
    max-width: none;
  }
}

/* ====================== THEORY EXAM (Chestionare) ====================== */
.mtiles {
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 6px;
}
.mtile span {
  font-size: 11.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}
.btn[data-theory] {
  display: grid;
  margin-top: 8px;
  height: auto;
  padding: 8px 12px;
}
.btn[data-theory] small {

  font-weight: 500;
  opacity: 0.75;

}
.thintro,
.thstats,
.thnote {
  font-size: 13.5px;

.thopt.wrong {

.thres p {

.thmh {

}
.thmist {

}
.thmi {

.thmi img {

.thmi li.r {

@media (orientation: portrait) {

  .thbar small {

/* the exam fills the screen so nothing is cut off on short landscape phones */
.overlay.center .sheet.theory.exam {
  position: fixed;
  top: max(8px, env(safe-area-inset-top, 0px));
  bottom: max(8px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(calc(100% - 16px), 900px);
  max-height: none;

@media (max-height: 500px) {

  }
  .thbar b {
    font-size: 15px;
  }
  .thbar .x {

  }
  .thimg {
    width: 84px;
  }

    gap: 5px;
  }

  }
  .thopt {

  }
  .thopt i {

  .thactions .btn {

    font-size: 13.5px;
  }
  .thwhy {
    padding: 5px 8px;
    font-size: 12px;
  }

.stack.three {

  grid-template-columns: repeat(3, minmax(0, 1fr));

.btn[data-theory] {

}

  }
}

/* ====================== THE BOOK (Cartea șoferului) ====================== */
.mtiles {
  grid-template-columns: repeat(6, minmax(0, 1fr));
}
@media (orientation: portrait) {
  .mtiles {
    grid-template-columns: repeat(3, minmax(0, 1fr));
  }
}
.book {
  position: fixed;
  top: max(8px, env(safe-area-inset-top, 0px));
  bottom: max(8px, env(safe-area-inset-bottom, 0px));
  left: 50%;
  transform: translateX(-50%);
  width: min(calc(100% - 16px), 760px);
  perspective: 1600px;
}
.bk-page {
  --paper: #fbf5e6;
  --ink: #2b2118;
  --rule: #e2d6bb;
  height: 100%;
  display: flex;
  flex-direction: column;
  background: linear-gradient(90deg, rgba(0, 0, 0, 0.12) 0, rgba(0, 0, 0, 0) 22px), var(--paper);
  color: var(--ink);
  border-radius: 6px 16px 16px 6px;
  border-left: 8px solid #7a3e1d;
  box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45), inset -1px 0 0 var(--rule);
  font-family: Georgia, 'Times New Roman', serif;
  transform-origin: left center;
  overflow: hidden;
}
.bk-page.flip-next {

}
.bk-page.flip-prev {
  animation: bkPrev 0.38s ease-out;
}
@keyframes bkNext {
  from {
    transform: rotateY(-28deg);
    opacity: 0.4;

}
@keyframes bkPrev {

    opacity: 0.4;

.bk-head {

  align-items: center;

}
.bk-head span {

  text-align: center;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.bk-x {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(122, 62, 29, 0.1);
  color: var(--ink);
  font-size: 20px;
  display: grid;
  place-items: center;
}
.bk-body,
.bk-cover {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overscroll-behavior: contain;
  padding: 10px 22px 14px 26px;
  font-size: 15.5px;
  line-height: 1.5;
}
.bk-body h4 {
  font-size: 19px;
  margin: 8px 0 6px;
  color: #7a3e1d;
}
.bk-body p {
  margin: 0 0 8px;
}
.bk-body ul {
  margin: 0 0 10px;
  padding-left: 20px;
}
.bk-body li {
  margin-bottom: 4px;
}
.bk-body table {

  border-collapse: collapse;
  margin: 4px 0 10px;
  font-size: 14.5px;
}
.bk-body th,
.bk-body td {
  text-align: left;
  padding: 5px 8px;
  border-bottom: 1px solid var(--rule);

}
.bk-body th {
  font-family: Inter, system-ui, sans-serif;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.05em;

}
.bk-tip {

/* ====================== LEVEL CELEBRATION ====================== */
.party {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}
.party i {
  position: absolute;
  top: -12px;
  width: 9px;
  height: 14px;
  border-radius: 2px;
  animation: confetti linear infinite;
}
@keyframes confetti {
  0% {
    transform: translateY(-20px) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(110vh) rotate(720deg);
    opacity: 0.8;
  }
}
.overlay.center .sheet.celebrate {
  width: min(calc(100% - 24px), 420px);
  align-items: center;
  text-align: center;
  padding: 18px 20px 20px;
  gap: 6px;
  animation: pop 0.45s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.celebrate .trophy {
  font-size: 56px;
  line-height: 1;
  animation: bounce 1.2s ease-in-out infinite;
}
.celebrate h2 {
  font-size: 28px;
  margin: 4px 0 0;
  color: #1f9d55;
}
.celebrate p {
  font-size: 17px;
  margin: 0 0 6px;
}
.celebrate .btn {
  margin-top: 8px;
  width: 100%;
}
@keyframes pop {
  from {
    transform: scale(0.6);
    opacity: 0;
  }
}
@keyframes bounce {
  50% {
    transform: translateY(-8px) scale(1.06);
  }
}
@media (max-height: 420px) {
  .celebrate .trophy {
    font-size: 40px;
  }
  .celebrate h2 {
    font-size: 22px;
  }
  .celebrate p {
    font-size: 15px;
  }
}
.bk-read {

  font-size: 14px;
  opacity: 0.7;
}
.bk-progress {
  margin: 12px 0 0;
  text-align: center;
  font-size: 14px;
}

/* =====================================================================
   IMPECCABLE PASS — instrument-cluster look (kept last, overrides above)
   Graphite panels with hairlines, one navigation blue, signal amber for
   things that blink, condensed display type, tabular numbers, 8px grid.
   ===================================================================== */
:root {
  --ink-1: #f3f5f6; /* primary text on dark */
  --ink-2: #aeb7be; /* secondary text on dark */
  --panel: rgba(15, 19, 23, 0.84);
  --panel-2: rgba(22, 27, 33, 0.92);
  --hair: rgba(255, 255, 255, 0.1);
  --hair-2: rgba(255, 255, 255, 0.2);
  --route: #3884ff;
  --amber: #ffb020;
  --r-hud: 8px;
  --r-btn: 10px;
  --r-sheet: 14px;
  --glass: var(--panel);
  --glass-line: var(--hair);
  --glass-fg: var(--ink-1);
}

/* HUD is a control surface: nothing to select, no grey tap flash */
#hud,
#bl,
#br,
#overlays .btn,
#overlays button {
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
}

/* ---- panels: hairline, no blur shadows, tight radius ---- */
.pill,
#tl .pill,
.tb,
#bMenu {
  border-radius: var(--r-hud);
  border: 1px solid var(--hair);
  background: var(--panel);
  box-shadow: none;
}
#tc {
  border-radius: 12px;
  border: 1px solid var(--hair);
  background: var(--panel);
  box-shadow: none;
  padding: 4px;
  gap: 0;
}
#tc .tb {
  border-color: transparent;
}
#tl,
#tr {
  gap: 8px;
}

/* ---- navigation banner: graphite with a blue lead bar, not a violet blob ---- */
#nav {
  background: var(--panel-2);
  border: 1px solid var(--hair);
  border-left: 3px solid var(--route);
  border-radius: var(--r-hud);
  box-shadow: none;
  padding: 8px 16px 8px 8px;
  gap: 8px;
  color: var(--ink-1);
}
#nav svg {
  color: var(--route);
}

/* ---- minimap: hairline ring, no glow ---- */
#minimap {
  border: 2px solid var(--hair-2);
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.45);
}

/* ---- numbers never jitter ---- */
#pts,
#progTxt,
#fuelTxt,
#limNum,
.pill b,
.thbar b,
.cel-stats b,
.stat b,
.stats b {
  font-family: var(--font-num);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
}

/* ---- hierarchy: condensed display headings, quieter metadata ---- */
.sheet-head h2,
.celebrate h2,
.thres h2,
.bk-title h2 {
  font-family: var(--font-num);
  font-weight: 700;
  letter-spacing: 0.01em;
}
.sheet-head h2 {
  font-size: 22px;
}
.pill .k,
.thbar small,
.cel-stats small,
.btn small,
.sheet-head + .sheet-body small {
  color: inherit;
  opacity: 0.7;
}

/* ---- sheets and cards: less rounding, hairline instead of a heavy shadow ---- */
.sheet {
  border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.22);
  border: 1px solid var(--line);
}
.overlay.center .sheet {
  border-radius: var(--r-sheet);
}
.x,
.bk-x {
  border-radius: var(--r-hud);
}
#card,
#toast {
  border-radius: 12px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}
.btn {
  border-radius: var(--r-btn);
}
.mtile,
.thopt,
.thbar > span,
.thresume,
.thask,
.cel-stats > div {
  border-radius: var(--r-btn);
}
.mtile {
  border-width: 1px;
}

/* answer options: selection without a border-width jump (no layout shift) */
.thopt {
  border: 1px solid var(--line);
  box-shadow: none;
}
.thopt.on {
  border-color: var(--accent);
  box-shadow: inset 0 0 0 1px var(--accent);
}
.thopt.right {
  box-shadow: inset 0 0 0 1px #1f9d55;
}
.thopt.wrong {
  box-shadow: inset 0 0 0 1px #d64545;
}

/* ---- tactile controls: luminance + edge on press, never a size change ---- */
.ctl {
  border: 1px solid var(--hair-2);
  box-shadow: none;
  transition: background 0.05s, border-color 0.05s;
}
.ctl.down,
.ctl:active,
.tb:active,
#bMenu:active,
.btn:active,
.mtile:active {
  transform: none;
}
.ctl.down,
.ctl:active,
.tb:active,
#bMenu:active {
  background: rgba(255, 255, 255, 0.16);
  border-color: rgba(255, 255, 255, 0.6);
}
.btn:active,
.mtile:active {
  filter: brightness(0.92);
}
.pedal {
  border-radius: 14px;
}
.pedal.gas.down {
  background: rgba(31, 157, 85, 0.45);
  border-color: #46c57e;
}
.pedal.brake.down {
  background: rgba(211, 58, 49, 0.45);
  border-color: #ff6f62;
}
.arw {
  border-radius: 14px;
}

/* blinkers and hazards: signal amber, a flat fill instead of a glow */
#tc .tb.sig.on.blink,
#tc .tb.haz.on.blink {
  background: var(--amber);
  color: #1d1400;
  box-shadow: none;
}
/* narrow screens: a setting's buttons go under its label, full width */
@media (max-width: 520px) {
  .sheet-body .row {
    flex-wrap: wrap;
    gap: 8px;
  }
  .sheet-body .row > span {
    flex: 1 1 100%;
  }
  .sheet-body .row .seg2 {
    width: 100%;
    display: flex;
  }
  .sheet-body .row .seg2 button {
    flex: 1;
  }
}

/* ---- impeccable, pass 2: results, level list, close buttons ---- */
/* results: one verdict, stats on hairlines instead of grey boxes */
.stats {
  gap: 0;
  border-top: 1px solid var(--line);
}
.stats div {
  background: none;
  border-radius: 0;
  padding: 8px 0;
  border-bottom: 1px solid var(--line);
}
.stats div:nth-child(odd) {
  padding-right: 16px;
  border-right: 1px solid var(--line);
}
.stats div:nth-child(even) {
  padding-left: 16px;
}
.stats span {
  font-size: 12px;
  letter-spacing: 0.02em;
}
/* category bars: the bar shows how you did; the category colour is a small dot */
.catrow .label::before {
  content: '';
  display: inline-block;
  width: 8px;
  height: 8px;
  border-radius: 2px;
  margin-right: 8px;
  vertical-align: 1px;
  background: var(--cat);
}
.bar {
  height: 6px;
  border-radius: 3px;
}
.bar i {
  background: var(--fill, var(--accent));
  border-radius: 3px;
}

/* level list: rows of a schedule, not a pile of cards */
.lvgrid {
  gap: 0 16px;
}
.lvtile {
  background: none;
  border: 0;
  border-bottom: 1px solid var(--line);
  border-radius: 0;
  padding: 10px 8px 10px 0;
  box-shadow: none;
}
.lvtile.sel {
  border: 0;
  border-bottom: 1px solid var(--line);
  box-shadow: inset 3px 0 0 var(--accent);
  padding-left: 12px;
}
.lvtile:active {
  background: var(--surface-2);
}
.lvtag {
  font-variant-numeric: tabular-nums;
}
.lvtile b {
  font-weight: 700;
}
.lvd {
  color: var(--muted);
}
.lvm {
  font-weight: 500;
  color: var(--muted);
  opacity: 0.85;
  font-size: 12px;
}

/* close buttons: quiet, hairline, still a 40px touch target */
.x {
  width: 40px;
  height: 40px;
  background: transparent;
  border: 1px solid var(--line);
  font-size: 20px;
}
.x:active {
  background: var(--surface-2);
}

/* ===================== GAME FEEL (kept last) =====================
   Motion eases out like something with weight; feedback is saved for
   the moments that matter. Reduced-motion users get none of it. */
:root {
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}
/* sign card and messages slide up into the dock */
#card:not([hidden]),
#toast:not([hidden]) {
  animation: dockIn 0.28s var(--ease-out);
}
@keyframes dockIn {
  from {
    transform: translateY(14px);
    opacity: 0;
  }
}
/* the navigation banner eases in when the next instruction changes */
#nav:not([hidden]) {
  animation: navIn 0.24s var(--ease-out);
}
@keyframes navIn {
  from {
    transform: translate(-50%, -6px);
    opacity: 0;
  }
}
/* sheets rise with a soft spring; menus feel like they have weight */
.sheet,
.book {
  animation: sheetIn 0.3s var(--ease-out);
}
.overlay.center .sheet {
  animation: sheetPop 0.26s var(--ease-spring);
}
@keyframes sheetIn {
  from {
    transform: translateY(18px);
    opacity: 0;
  }
}
@keyframes sheetPop {
  from {
    transform: scale(0.96);
    opacity: 0;
  }
}
.overlay {
  animation: fade 0.2s var(--ease-out);
}
/* exam penalty: a red edge pulse, once */
#app.penflash::before {
  content: '';
  position: absolute;
  inset: 0;
  z-index: 29;
  pointer-events: none;
  box-shadow: inset 0 0 0 6px rgba(214, 40, 40, 0.95), inset 0 0 120px rgba(214, 40, 40, 0.7);
  animation: penflash 0.7s var(--ease-out) forwards;
}
@keyframes penflash {
  from {
    opacity: 1;
  }
  to {
    opacity: 0;
  }
}
/* the speed-limit badge pulses (scale) instead of blinking on and off */
#limit.over {
  animation: limitPulse 0.6s var(--ease-out) infinite;
}
@keyframes limitPulse {
  0% {
    transform: scale(1);
    box-shadow: 0 0 0 0 rgba(214, 40, 40, 0.6);
  }
  60% {
    transform: scale(1.08);
    box-shadow: 0 0 0 8px rgba(214, 40, 40, 0);
  }
  100% {
    transform: scale(1);
  }
}
@media (prefers-reduced-motion: reduce) {
  #card:not([hidden]),
  #toast:not([hidden]),
  #nav:not([hidden]),
  .sheet,
  .book,
  .overlay,
  #limit.over {
    animation: none !important;
  }
}

/* ---------- game feel: interface ---------- */
/* score and penalty pop when they go up */
#pts.bump,
#pen.bump {
  animation: bump 0.42s var(--ease-spring);
  display: inline-block;
}
#pen.bump {
  color: #ff7b72;
}
@keyframes bump {
  0% {
    transform: scale(1);
  }
  35% {
    transform: scale(1.35);
  }
  100% {
    transform: scale(1);
  }
}
/* the fuel bar slides instead of jumping */
#pillFuel .fbar i {
  transition: width 0.45s var(--ease-out), background-color 0.3s;
}
/* menu tiles cascade in */
.mtiles .mtile {
  animation: tileIn 0.32s var(--ease-out) both;
}
.mtiles .mtile:nth-child(2) { animation-delay: 0.03s; }
.mtiles .mtile:nth-child(3) { animation-delay: 0.06s; }
.mtiles .mtile:nth-child(4) { animation-delay: 0.09s; }
.mtiles .mtile:nth-child(5) { animation-delay: 0.12s; }
.mtiles .mtile:nth-child(6) { animation-delay: 0.15s; }
@keyframes tileIn {
  from {
    transform: translateY(8px);
    opacity: 0;
  }
}
/* segmented switches: the selected fill fades across instead of snapping */
.seg2 button,
.seg button {
  transition: background-color 0.18s var(--ease-out), color 0.18s var(--ease-out);
}
/* HUD toggles: lights and engine colour changes ease in */
.tb {
  transition: background-color 0.12s, color 0.18s, border-color 0.12s;
}
/* parking stars pop in one after another */
#toast.parked .stars {
  margin-left: 6px;
  letter-spacing: 2px;
}
#toast.parked .star {
  font-style: normal;
  display: inline-block;
  color: var(--line);
  animation: starIn 0.4s var(--ease-spring) both;
}
#toast.parked .star.on {
  color: #f5b301;
}
@keyframes starIn {
  from {
    transform: scale(0) rotate(-40deg);
    opacity: 0;
  }
}
@media (prefers-reduced-motion: reduce) {
  #pts.bump,
  #pen.bump,
  .mtiles .mtile,
  #toast.parked .star {
    animation: none !important;
  }
  #pillFuel .fbar i {
    transition: none;
  }

/* ---- impeccable, pass 3: car picker, sign library, quiz answers ---- */

.tile {

  background: var(--surface);

}
.thopt.right i {

  color: #fff;
}
.thopt.wrong.on {
  box-shadow: inset 0 0 0 1px #d64545;
  border-color: #d64545;
}
/* quiz answers: the wrong pick shakes no, the right one breathes once */
.thopt.nudge {
  animation: nudge 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97);
}
@keyframes nudge {

  40% { transform: translateX(5px); }
  60% { transform: translateX(-3px); }

  100% { box-shadow: inset 0 0 0 1px #1f9d55, 0 0 0 10px rgba(31, 157, 85, 0); }
}
.thopt {
  transition: background-color 0.15s var(--ease-out), border-color 0.15s;
}
@media (prefers-reduced-motion: reduce) {

.tile {

/* celebration stats: hairline columns, not boxes */

a","Nim\u0103nui, dac\u0103 a\u021Bi semnalizat"],ok:[0,1],why:"C\xE2nd faci st\xE2nga, \xEEi la\u0219i pe cei din fa\u021B\u0103 s\u0103 treac\u0103, fie c\u0103 merg drept, fie c\u0103 fac dreapta."},{ch:"prioritate",q:"Poli\u021Bistul v\u0103 face semn s\u0103 trece\u021Bi, de\u0219i semaforul arat\u0103 ro\u0219u. Ce face\u021Bi?",a:["Respecta\u021Bi semaforul","Respecta\u021Bi semnalul poli\u021Bistului","Opri\u021Bi \u0219i a\u0219tepta\u021Bi verdele"],ok:[1],why:"Ce arat\u0103 poli\u021Bistul conteaz\u0103 mai mult dec\xE2t semaforul \u0219i indicatoarele."},{ch:"semafoare",q:"Ce semnific\u0103 s\u0103geata verde intermitent\u0103 montat\u0103 l\xE2ng\u0103 lumina ro\u0219ie a semaforului?",a:["Pute\u021Bi vira \xEEn direc\u021Bia s\u0103ge\u021Bii, acord\xE2nd prioritate celorlal\u021Bi participan\u021Bi la trafic","Ave\u021Bi prioritate fa\u021B\u0103 de to\u021Bi ceilal\u021Bi","Trebuie s\u0103 a\u0219tepta\u021Bi lumina verde"],ok:[0],why:"S\u0103geata verde \xEE\u021Bi d\u0103 voie s\u0103 virezi, nu \xEE\u021Bi d\u0103 prioritate. Pietonii \u0219i cei cu verde trec primii."},{ch:"semafoare",q:"Ce semnific\u0103 lumina galben\u0103 intermitent\u0103 a semaforului?",a:["Circula\u021Bi cu aten\u021Bie, respect\xE2nd indicatoarele \u0219i regulile de prioritate","Opri\u021Bi obligatoriu","Ave\u021Bi prioritate fa\u021B\u0103 de to\u021Bi"],ok:[0],why:"Semaforul nu dirijeaz\u0103 c\xE2nd clipe\u0219te galben. Treci dup\u0103 indicatoare \u0219i dup\u0103 reguli."},{ch:"semafoare",q:"Semaforul trece din verde \xEEn galben fix. Ce face\u021Bi?",a:["Opri\u021Bi \xEEnainte de semafor","Trece\u021Bi dac\u0103 sunte\u021Bi at\xE2t de aproape \xEEnc\xE2t nu mai pute\u021Bi opri \xEEn siguran\u021B\u0103","Accelera\u021Bi ca s\u0103 prinde\u021Bi verdele"],ok:[0,1],why:"Galben fix \xEEnseamn\u0103 stop. Treci doar dac\u0103 e\u0219ti deja at\xE2t de aproape c\u0103 o fr\xE2n\u0103 brusc\u0103 ar fi periculoas\u0103."},{ch:"prioritate",q:"Vre\u021Bi s\u0103 intra\u0 03 refugiu pentru pietoni. Ce face\u021Bi?",a:["Opri\u021Bi \xEEn spatele tramvaiului c\xE2t urc\u0103 \u0219i coboar\u0103 c\u0103l\u0103torii","Trece\u021Bi pe l\xE2ng\u0103 el cu vitez\u0103 mare","Claxona\u021Bi"],ok:[0],why:"Oamenii coboar\u0103 din tramvai direct pe carosabil, a\u0219a c\u0103 a\u0219tep\u021Bi \xEEn spatele lui."},{ch:"oprire",q:"C\xE2nd pute\u021Bi dep\u0103\u0219i pe partea dreapt\u0103?",a:["C\xE2nd vehiculul din fa\u021B\u0103 a semnalizat virajul la st\xE2nga \u0219i s-a deplasat spre st\xE2nga","Oric\xE2nd ave\u021Bi loc","Pe acostament, c\xE2nd e aglomerat"],ok:[0],why:"Dep\u0103\u0219e\u0219ti pe st\xE2nga. Pe dreapta doar c\xE2nd cel din fa\u021B\u0103 a semnalizat st\xE2nga \u0219i s-a tras spre mijloc."},{ch:"oprire",q:"Unde este interzis\u0103 dep\u0103\u0219irea?",a:["Pe trecerea pentru pietoni","\xCEn tunel","Pe un drum drept, cu vizibilitate bun\u0103 \u0219i linie discontinu\u0103"],ok:[0,1],why:"Pe zebr\u0103 \u0219i \xEEn tunel nu dep\u0103\u0219e\u0219ti, nici dac\u0103 pare liber."},{ch:"oprire",q:"Unde este interzis mersul \xEEnapoi?",a:["Pe autostrad\u0103","\xCEn intersec\u021Bii","\xCEntr-o parcare, cu vizibilitate bun\u0103"],ok:[0,1],why:"Cu spatele nu mergi pe autostrad\u0103 \u0219i nici \xEEn intersec\u021Bie."},{ch:"oprire",q:"Unde este interzis\u0103 oprirea voluntar\u0103?",a:["Pe trecerea pentru pietoni","\xCEn tunel","Pe un loc de parcare marcat"],ok:[0,1],why:"Pe zebr\u0103 \u0219i \xEEn tunel nu ai voie nici m\u0103car s\u0103 opre\u0219ti."},{ch:"oprire",q:"La ce distan\u021B\u0103 de indicatorul unei sta\u021Bii de autobuz este interzis\u0103 oprirea?",a:["La mai pu\u021Bin de 10 m \xEEnainte \u0219i dup\u0103","La mai pu\u021Bin de 25 m \xEEnainte \u0219i dup\u0103","La mai pu\u021Bin de 50 m \xEEnainte"],ok:[1],why:"La\u0219i liberi c\xE2te 25 de metri \xEEnainte \u0219i dup\u0103 indicatorul sta\u021Biei de autobuz."},{ch:"oprire",q:"C\xE2t poate dura cel mult oprirea voluntar\u0103 a unui vehicul?",a:["5 minute","10 minute","15 minute"],ok:[0],why:"P\xE2n\u0103 la 5 minute e oprire. Mai mult de at\xE2t e sta\u021Bionare."},{ch:"semafoare",q:"Ce \xEEnseamn\u0103 marcajul cu linie continu\u0103 din mijlocul drumului?",a:["Nu ave\u021Bi voie s\u0103 \xEEl \xEEnc\u0103lca\u021Bi sau s\u0103 \xEEl trece\u021Bi","Pute\u021Bi dep\u0103\u0219i dac\u0103 nu vine nimeni","Pute\u021Bi \xEEntoarce peste el"],ok:[0],why:"Linia continu\u0103 nu se calc\u0103, nici pentru o dep\u0103\u0219ire scurt\u0103."},{ch:"oprire",q:"Vre\u021Bi s\u0103 schimba\u021Bi banda. Ce face\u021Bi?",a:["Semnaliza\u021Bi din timp","V\u0103 uita\u021Bi \xEEn oglinzi \u0219i \xEEn unghiul mort","Schimba\u021Bi banda brusc, ca s\u0103 nu pierde\u021Bi timp"],ok:[0,1],why:"Te ui\u021Bi \xEEn oglinzi \u0219i \xEEn unghiul mort, semnalizezi, apoi treci lin pe cealalt\u0103 band\u0103."},{ch:"sofer",q:"Ave\u021Bi voie s\u0103 conduce\u021Bi dup\u0103 ce a\u021Bi consumat alcool?",a:["Nu, conducerea sub influen\u021Ba alcoolului este interzis\u0103","Da, dac\u0103 v\u0103 sim\u021Bi\u021Bi bine","Da, dac\u0103 a\u021Bi b\u0103ut doar o bere"],ok:[0],why:"Nu conduci dup\u0103 ce ai b\u0103ut. Peste 0,40 mg/l \xEEn aerul expirat e deja dosar penal."},{ch:"sofer",q:"Cum ave\u021Bi voie s\u0103 folosi\u021Bi telefonul mobil \xEEn timpul mersului?",a:["Numai cu un sistem \u201Em\xE2ini libere\u201D","\u021Ain\xE2ndu-l \xEEn m\xE2n\u0103, dac\u0103 vorbi\u021Bi pu\u021Bin","\u021Ain\xE2ndu-l \xEEn m\xE2n\u0103, la semafor"],ok:[0],why:"Telefonul st\u0103 \xEEn suport. \xCEn m\xE2n\u0103 nu \xEEl \u021Bii c\xE2t conduci."},{ch:"sofer",q:"Cine trebuie s\u0103 poarte centura de siguran\u021B\u0103?",a:["\u0218oferul","Pasagerul din fa\u021B\u0103","Pasagerii din spate"],ok:[0,1,2],why:"Centura o pune toat\u0103 lumea, inclusiv cei din spate."},{ch:"sofer",q:"Cum transporta\u021Bi un copil mic \xEEntr-un autoturism?",a:["\xCEntr-un sistem de re\u021Binere (scaun pentru copii) potrivit v\xE2rstei \u0219i \xEEn\u0103l\u021Bimii","\xCEn bra\u021Bele unui adult","Liber pe bancheta din spate"],ok:[0],why:"Copiii mici stau \xEEn scaunul lor, potrivit pentru v\xE2rst\u0103 \u0219i \xEEn\u0103l\u021Bime, nu \xEEn bra\u021Be."},{ch:"sofer",q:"Care este v\xE2rsta minim\u0103 pentru permisul de categoria B?",a:["16 ani","18 ani","21 de ani"],ok:[1],why:"Permisul de categoria B \xEEl po\u021Bi lua de la 18 ani."},{ch:"sofer",q:"C\xE2t timp este valabil permisul de conducere de categoria B?",a:["5 ani","10 ani","Pe via\u021B\u0103"],ok:[1],why:"Permisul de categoria B \xEEl schimbi o dat\u0103 la 10 ani."},{ch:"sofer",q:"C\xE2nd sunt obligatorii anvelopele de iarn\u0103?",a:["C\xE2nd drumul este acoperit cu z\u0103pad\u0103, ghea\u021B\u0103 sau polei","Numai \xEEn ianuarie","Niciodat\u0103"],ok:[0],why:"C\xE2nd e z\u0103pad\u0103, ghea\u021B\u0103 sau polei, cauciucurile de iarn\u0103 sunt obligatorii, indiferent de lun\u0103."},{ch:"accidente",q:"Ma\u0219ina r\u0103m\xE2ne \xEEn pan\u0103 pe carosabil. Ce face\u021Bi?",a:["Aprinde\u021Bi luminile de avarie","Semnaliza\u021Bi vehiculul cu triunghiurile reflectorizante","Pleca\u021Bi \u0219i l\u0103sa\u021Bi ma\u0219ina nesemnalizat\u0103"],ok:[0,1],why:"Pui avariile \u0219i triunghiurile reflectorizante, ca s\u0103 te vad\u0103 cei din spate de departe."},{ch:"accidente",q:"Ajunge\u021Bi primul la un accident cu r\u0103ni\u021Bi. Ce face\u021Bi?",a:["Suna\u021Bi la 112","Acorda\u021Bi primul ajutor, dac\u0103 \u0219ti\u021Bi \u0219i nu v\u0103 pune\u021Bi \xEEn pericol","Pleca\u021Bi, ca s\u0103 nu \xEEnt\xE2rzia\u021Bi"],ok:[0,1],why:"Suni la 112 \u0219i aju\u021Bi f\u0103r\u0103 s\u0103 te pui \xEEn pericol. De la un accident cu r\u0103ni\u021Bi nu pleci."},{ch:"accidente",q:"O victim\u0103 a unui accident este incon\u0219tient\u0103 \xEEn ma\u0219in\u0103. C\xE2nd o scoate\u021Bi din vehicul?",a:["Numai dac\u0103 este \xEEn pericol imediat, de exemplu foc","\xCEntotdeauna, imediat","Niciodat\u0103, chiar dac\u0103 ma\u0219ina arde"],ok:[0],why:"Dac\u0103 o mi\u0219ti, po\u021Bi agrava r\u0103nile. O sco\u021Bi doar dac\u0103 r\u0103m\xE2nerea acolo e mai periculoas\u0103, de exemplu foc."},{ch:"preventiv",q:"Sim\u021Bi\u021Bi c\u0103 ma\u0219ina \u201Eplute\u0219te\u201D pe ap\u0103 (acvaplanare). Ce face\u021Bi?",a:["Ridica\u021Bi piciorul de pe accelera\u021Bie","\u021Aine\u021Bi volanul drept","Fr\xE2na\u021Bi brusc"],ok:[0,1],why:"La\u0219i accelera\u021Bia \u0219i \u021Bii volanul drept. O fr\xE2n\u0103 sau un viraj brusc te pot arunca \xEEn derapaj."},{ch:"preventiv",q:"Cum circula\u021Bi pe cea\u021B\u0103?",a:["Reduce\u021Bi viteza","Folosi\u021Bi faza lung\u0103","M\u0103ri\u021Bi distan\u021Ba fa\u021B\u0103 de vehiculul din fa\u021B\u0103"],ok:[0,2],why:"Pe cea\u021B\u0103 faza lung\u0103 se \xEEntoarce \xEEn ochii t\u0103i. Folose\u0219ti faza scurt\u0103 \u0219i proiectorul de cea\u021B\u0103."},{ch:"preventiv",q:"Noaptea, cu faza lung\u0103 aprins\u0103, vine un vehicul din sens opus. Ce face\u021Bi?",a:["Trece\u021Bi pe faza scurt\u0103","P\u0103stra\u021Bi faza lung\u0103","Stinge\u021Bi toate luminile"],ok:[0],why:"Faza lung\u0103 \xEEl orbe\u0219te pe cel care vine. Treci pe faza scurt\u0103 c\xE2nd v\u0103 \xEEnt\xE2lni\u021Bi."},{ch:"preventiv",q:"De ce depinde distan\u021Ba de siguran\u021B\u0103 fa\u021B\u0103 de vehiculul din fa\u021B\u0103?",a:["De vitez\u0103","De starea drumului (uscat, ud, \xEEnghe\u021Bat)","De culoarea ma\u0219inii"],ok:[0,1],why:"Cu c\xE2t mergi mai repede \u0219i cu c\xE2t drumul e mai ud sau mai \xEEnghe\u021Bat, cu at\xE2t la\u0219i mai mult loc \xEEn fa\u021B\u0103."},{ch:"preventiv",q:"V\u0103 sim\u021Bi\u021Bi obosit la volan. Ce face\u021Bi?",a:["Opri\u021Bi \xEEntr-un loc sigur \u0219i v\u0103 odihni\u021Bi","Deschide\u021Bi geamul \u0219i mai conduce\u021Bi c\xE2teva ore","M\u0103ri\u021Bi viteza ca s\u0103 ajunge\u021Bi mai repede"],ok:[0],why:"Oboseala \xEE\u021Bi \xEEncetine\u0219te reac\u021Biile. Singurul lucru care ajut\u0103 cu adev\u0103rat e s\u0103 opre\u0219ti \u0219i s\u0103 te odihne\u0219ti."},{ch:"preventiv",q:"Ce \xEEnseamn\u0103 s\u0103 conduce\u021Bi economic?",a:["Schimba\u021Bi treptele de vitez\u0103 la tura\u021Bii moderate","Anticipa\u021Bi traficul ca s\u0103 evita\u021Bi fr\xE2n\u0103rile bru\u0219te","L\u0103sa\u021Bi motorul s\u0103 mearg\u0103 mult timp la ralanti"],ok:[0,1],why:"Accelerarea \u0219i fr\xE2narea lin\u0103 consum\u0103 mai pu\u021Bin dec\xE2t smuciturile."},{ch:"semafoare",q:"La o trecere la nivel cu calea ferat\u0103, lumina ro\u0219ie clipe\u0219te. Ce face\u021Bi?",a:["Opri\u021Bi: trecerea este interzis\u0103","Trece\u021Bi repede, dac\u0103 nu vede\u021Bi trenul","Ocoli\u021Bi bariera"],ok:[0],why:"Ro\u0219ul care clipe\u0219te anun\u021B\u0103 c\u0103 vine trenul. Opre\u0219ti, chiar dac\u0103 \xEEnc\u0103 nu-l vezi."}];var ro=t=>ga().filter(s=>$e[s].category===t),mt=[{id:"semne",title:"Indicatoarele",sign:"stop",pages:[[{h:"\xCEnainte s\u0103 le \xEEnve\u021Bi pe de rost"},{p:"Nu te apuca s\u0103 toce\u0219ti indicatoarele unul c\xE2te unul. Uit\u0103-te \xEEnt\xE2i la form\u0103 \u0219i la culoare. De la 50 de metri nu vezi desenul, dar vezi dac\u0103 e un triunghi ro\u0219u sau un cerc albastru, \u0219i deja \u0219tii cam ce urmeaz\u0103."},{table:[["Ce vezi","Ce-\u021Bi spune"],["Triunghi cu margine ro\u0219ie","Aten\u021Bie, urmeaz\u0103 ceva: o curb\u0103, copii, o \xEEngustare"],["Octogon ro\u0219u, romb galben, triunghi cu v\xE2rful \xEEn jos","Cine trece primul prin intersec\u021Bie"],["Cerc cu margine ro\u0219ie","Ceva ce nu ai voie s\u0103 faci"],["Cerc albastru plin","Ceva ce trebuie s\u0103 faci"],["P\u0103trat sau dreptunghi albastru","Doar te informeaz\u0103"]]},{tip:"C\xE2nd semaforul spune una \u0219i indicatorul alta, ascul\u021Bi de semafor. C\xE2nd poli\u021Bistul spune altceva dec\xE2t am\xE2ndou\u0103, ascul\u021Bi de poli\u021Bist.",label:"Ordinea"}],...["priority","warning","prohibition","mandatory","information"].map(t=>[{h:Bt[t
